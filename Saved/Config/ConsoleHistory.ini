[ConsoleHistory]
History="// UI water: no textures, no scene access, valid in the User Interface domain\r\nfloat2 uv = UV * Tiling;\r\nfloat  t  = Time * Speed;\r\n\r\n// two scrolling coordinate sets, each bending the other\r\nfloat2 p1 = uv + float2( t * 0.35,  t * 0.22);\r\nfloat2 p2 = uv * 1.9 - float2( t * 0.28, -t * 0.19);\r\n\r\nfloat w1 = sin(p1.x * 5.0 + sin(p1.y * 3.7 + t * 0.9) * 1.4);\r\nfloat w2 = sin(p2.y * 6.3 + sin(p2.x * 2.9 - t * 0.7) * 1.2);\r\nfloat warp = (w1 + w2) * 0.5;\r\n\r\n// domain-warped caustic cells\r\nfloat2 q = uv + warp * Distortion;\r\nfloat c1 = sin(q.x * 11.0 + t * 1.7) * sin(q.y * 9.0 - t * 1.3);\r\nfloat c2 = sin((q.x + q.y) * 7.5 + t * 2.1);\r\nfloat caustic = saturate(c1 * 0.5 + c2 * 0.5 + 0.55);\r\n\r\nfloat height = saturate(warp * 0.5 + 0.5);\r\nfloat depth  = saturate(UV.y);\r\n\r\n// colour: shallow at the top of the widget, deep at the bottom\r\nfloat3 col = lerp(ShallowColor.rgb, DeepColor.rgb, saturate(depth * 0.75 + height * 0.35));\r\ncol += pow(caustic, 3.0) * 0.35;\r\ncol += smoothstep(0.86, 1.0, caustic) * Foam;\r\n\r\nfloat a = saturate(Opacity * (0.80 + 0.20 * height));\r\nreturn float4(col, a);\r\n"

